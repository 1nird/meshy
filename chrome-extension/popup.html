<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meshy To STL</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Meshy To STL</h1>
        <button id="scan" type="button" title="Refresh current tab scan">Refresh</button>
      </header>

      <select id="links" size="7" aria-label="Detected .meshy files"></select>

      <label for="format">Output format</label>
      <select id="format">
        <option value="glb">GLB — Blender: keeps textures + rig</option>
        <option value="obj">OBJ + MTL (with UVs &amp; materials)</option>
        <option value="zip">OBJ + MTL + textures (ZIP)</option>
        <option value="stl">STL (3D printing)</option>
      </select>

      <div class="row">
        <button id="convert" type="button">Download GLB</button>
      </div>

      <progress id="progress" hidden></progress>
      <p id="status">Ready.</p>
      <p id="hint">Tip: for Blender use <strong>GLB</strong> — it bundles geometry, textures, rig and animations in one file. Use File ▸ Import ▸ glTF 2.0.</p>
    </main>

    <iframe id="sandbox" src="sandbox.html" hidden></iframe>
    <script src="gltf-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
